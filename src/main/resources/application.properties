spring.application.name=gestionUser

# JWT signing key — must stay stable across restarts or all issued tokens become invalid.
app.jwt.secret=baladna-dev-jwt-secret-replace-in-production-with-a-long-random-string

### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/baladna?&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# If startup logs show DDL errors on legacy event_media, run scripts/fix-event-media-mysql.sql then restart.

#Server configuration
server.port=8081

logging.level.org.springframework.security=DEBUG

# Return clear JSON error bodies to the Angular client
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-path=always

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

app.accommodation.upload-dir=uploads/accommodations
app.accommodation.public-base-url=http://localhost:8081

# Local Ollama model for trip accommodation suggestions
app.ai.ollama-base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
app.ai.ollama-model=${OLLAMA_MODEL:qwen2.5:7b-instruct}

### Optional e-mail (QR + confirmation)
# Shown as From: (use the same mailbox as SMTP login unless your provider allows aliases).
app.mail.from=zied.elwakkel@esprit.tn
# Esprit / Microsoft 365 — override with env in production; never commit real passwords here.
spring.mail.host=${MAIL_HOST:smtp.office365.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:zied.elwakkel@esprit.tn}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# IntelliJ: Run → Edit Configurations → Environment variables, e.g. MAIL_PASSWORD=... (do not commit).

# Cloudinary (events + forum uploads). Off by default so the app starts without credentials.
cloudinary.enabled=false
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Stripe (optional for local dev)
stripe.api.key=${STRIPE_API_KEY:}

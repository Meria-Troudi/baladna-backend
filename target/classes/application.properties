spring.application.name=gestionUser

# JWT signing key — must stay stable across restarts or all issued tokens become invalid.
# Use a long random value in production (32+ bytes). Dev default is hashed to 256 bits in JwtService.
app.jwt.secret=baladna-dev-jwt-secret-replace-in-production-with-a-long-random-string

### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/baladna?&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=


### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#Server configuration

server.port=8081

logging.level.org.springframework.security=DEBUG

# Return clear JSON error bodies to the Angular client
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-path=always

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

app.accommodation.upload-dir=uploads/accommodations
app.accommodation.public-base-url=http://localhost:8081

# Optional — free API key from https://aistudio.google.com/apikey (enables Gemini for trip descriptions).
# If empty, /api/accommodations/public/trip-suggest uses keyword matching only (no cost).
app.ai.gemini-api-key=AIzaSyBNOEM8J8o2QszVBoxpfviZV5aZknB7ujI
# If a model returns 404, try gemini-1.5-flash
app.ai.gemini-model=gemini-2.5-flash

